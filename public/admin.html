<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamuDev - Admin Panel SMTP</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f3f0ff 0%, #e9d8fd 100%); color: #333; margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(107, 70, 193, 0.12); border: 1px solid #d6bcfa; }
        .logo-header { text-align: center; margin-bottom: 10px; }
        .logo-header svg { width: 45px; height: 45px; fill: #6b46c1; }
        h1, h2 { color: #553c9a; text-align: center; }
        .nav-link { display: inline-block; margin-bottom: 15px; color: #6b46c1; font-weight: bold; text-decoration: none; }
        .nav-link:hover { text-decoration: underline; }
        .btn { background: #6b46c1; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; margin-top: 5px; }
        .btn:hover { background: #553c9a; }
        .btn-success { background: #38a169; }
        .btn-success:hover { background: #2f855a; }
        .btn-danger { background: #e53e3e; }
        .btn-danger:hover { background: #c53030; }
        .btn-warning { background: #d69e2e; color: white; }
        .btn-warning:hover { background: #b7791f; }
        input { width: 100%; padding: 11px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 14px; outline: none; background: #faf5ff; }
        input:focus { border-color: #6b46c1; background: #fff; box-shadow: 0 0 0 3px rgba(107, 70, 193, 0.15); }
        .auth-box { max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(107, 70, 193, 0.12); text-align: center; border: 1px solid #d6bcfa; }
        .admin-content { display: none; }
        .smtp-card { background: #faf5ff; border: 1px solid #e9d8fd; padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .smtp-info { font-size: 14px; word-break: break-all; color: #2d3748; }
        .action-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .batch-actions { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="auth-box" id="authBox">
    <div class="logo-header">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    </div>
    <h2>Login Admin</h2>
    <p style="color: #718096; font-size: 13px;">Masukkan kode akses sistem keamanan</p>
    <input type="password" id="accessCode" placeholder="Kode Akses...">
    <button class="btn" style="width:100%; padding: 12px;" onclick="verifyLogin()">Masuk Dashboard</button>
</div>

<div class="container admin-content" id="adminPanel">
    <a href="index.html" class="nav-link">⬅️ Kembali ke Form Reporter</a>
    <div class="logo-header">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-V6l8 5 8-5v2z"/></svg>
    </div>
    <h1>Admin Panel SMTP</h1>
    
    <div style="background: #f3f0ff; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #d6bcfa;">
        <h3 id="formTitle" style="margin-top: 0; color: #553c9a;">➕ Tambah Akun SMTP Baru</h3>
        <input type="hidden" id="editId">
        <label style="font-weight:600; color:#4a5568;">Email SMTP:</label>
        <input type="email" id="smtpEmail" placeholder="contoh@gmail.com">
        <label style="font-weight:600; color:#4a5568;">App Password SMTP:</label>
        <input type="password" id="smtpPass" placeholder="App password 16 digit">
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-success" onclick="saveSmtp()" id="saveBtn" style="flex: 1; padding: 12px;">Simpan ke Firebase</button>
            <button class="btn btn-warning" onclick="cancelEdit()" id="cancelBtn" style="display: none; flex: 1; padding: 12px;">Batal</button>
        </div>
    </div>

    <h2>📋 Daftar SMTP di Database</h2>
    <div class="batch-actions">
        <button class="btn btn-success" onclick="testAllSmtp()" style="flex: 1; padding: 12px;">⚡ Tes Semua SMTP</button>
        <button class="btn" onclick="loadSmtp()" style="flex: 1; background: #4a5568; padding: 12px;">🔄 Refresh List</button>
    </div>
    
    <div id="smtpList"></div>
</div>

<script>
    async function verifyLogin() {
        const code = document.getElementById('accessCode').value;
        try {
            const res = await fetch('/api/verify-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadSmtp();
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert("Kesalahan koneksi ke server.");
        }
    }

    async function loadSmtp() {
        const res = await fetch('/api/smtp');
        const data = await res.json();
        const list = document.getElementById('smtpList');
        list.innerHTML = '';

        if (data.data && Object.keys(data.data).length > 0) {
            for (const [id, acc] of Object.entries(data.data)) {
                list.innerHTML += `
                    <div class="smtp-card">
                        <div class="smtp-info">
                            <strong>Email:</strong> ${acc.email}<br>
                            <strong>Password:</strong> ${acc.password}
                        </div>
                        <div class="action-group">
                            <button class="btn btn-warning" style="padding: 6px 12px;" onclick="testSingleSmtp('${acc.email}', '${acc.password}')">Tes</button>
                            <button class="btn" style="padding: 6px 12px; background: #3182ce;" onclick="editSmtp('${id}', '${acc.email}', '${acc.password}')">Edit</button>
                            <button class="btn btn-danger" style="padding: 6px 12px;" onclick="deleteSmtp('${id}')">Hapus</button>
                        </div>
                    </div>
                `;
            }
        } else {
            list.innerHTML = '<p style="text-align: center; color: #a0aec0; padding: 20px;">Belum ada akun SMTP yang tersimpan.</p>';
        }
    }

    async function saveSmtp() {
        const id = document.getElementById('editId').value;
        const email = document.getElementById('smtpEmail').value;
        const password = document.getElementById('smtpPass').value;

        if (!email || !password) {
            alert("Email dan password harus diisi!");
            return;
        }

        const url = id ? `/api/smtp/${id}` : '/api/smtp';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        alert(data.message);
        
        cancelEdit();
        loadSmtp();
    }

    function editSmtp(id, email, password) {
        document.getElementById('editId').value = id;
        document.getElementById('smtpEmail').value = email;
        document.getElementById('smtpPass').value = password;
        document.getElementById('formTitle').innerText = "✏️ Edit Akun SMTP";
        document.getElementById('saveBtn').innerText = "Perbarui Akun";
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        document.getElementById('editId').value = '';
        document.getElementById('smtpEmail').value = '';
        document.getElementById('smtpPass').value = '';
        document.getElementById('formTitle').innerText = "➕ Tambah Akun SMTP Baru";
        document.getElementById('saveBtn').innerText = "Simpan ke Firebase";
        document.getElementById('cancelBtn').style.display = 'none';
    }

    async function deleteSmtp(id) {
        if (!confirm("Yakin ingin menghapus akun ini?")) return;
        const res = await fetch(`/api/smtp/${id}`, { method: 'DELETE' });
        const data = await res.json();
        alert(data.message);
        loadSmtp();
    }

    async function testSingleSmtp(email, password) {
        alert(`Mengetes koneksi ke ${email}...`);
        const res = await fetch('/api/test-smtp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        alert(data.message);
    }

    async function testAllSmtp() {
        alert("Mengetes semua akun SMTP di database, mohon tunggu sebentar...");
        const res = await fetch('/api/test-all-smtp', { method: 'POST' });
        const data = await res.json();
        
        if (data.success) {
            let report = "Hasil Tes Semua SMTP:\n\n";
            data.results.forEach(r => {
                report += `- ${r.email}: [${r.status}]\n`;
            });
            alert(report);
        } else {
            alert(data.message);
        }
    }
</script>

</body>
</html>
